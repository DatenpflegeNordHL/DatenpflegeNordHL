name: Refresh public contribution history

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-contributions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify privacy filters
        run: python3 -m unittest discover -s tests -v
      - name: Read public upstream contributions
        run: python3 scripts/update_contributions.py
      - name: Update profile when changed
        run: |
          if ! git diff --quiet -- README.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md
            git commit -m 'docs: refresh public accepted contributions'
            git push origin HEAD:main
          fi
